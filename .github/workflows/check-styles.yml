name: Check styles

# Header and @version lint plus unit tests. The live layout check needs a
# signed-in browser and runs on the maintainer's machine; see README.md.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Unit tests
        run: python3 -m unittest discover -s tests
      - name: Styles raise @version when their code changes
        env:
          BASE: ${{ github.event_name == 'pull_request' && format('origin/{0}', github.base_ref) || github.event.before }}
        run: |
          if [ -n "$BASE" ] && git cat-file -e "$BASE^{commit}" 2>/dev/null; then
            python3 lint.py --base "$BASE"
          else
            python3 lint.py
          fi
